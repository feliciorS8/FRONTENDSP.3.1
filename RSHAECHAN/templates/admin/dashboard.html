<!DOCTYPE html>
<html>
  <head>
    <title>Dashboard Admin</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
        padding: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      a {
        display: inline-block;
        margin-top: 15px;
        text-decoration: none;
        color: white;
        background: #4facfe;
        padding: 10px 15px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h2>Dashboard Admin</h2>

    <div class="card">
      <h3>Total Obat</h3>
      <h1>{{ total_obat }}</h1>
      <a href="{{ url_for('admin_obat') }}">Kelola Obat</a>
    </div>
  </body>
</html>
