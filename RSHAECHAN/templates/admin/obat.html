<!DOCTYPE html>
<html>
  <head>
    <title>Data Obat</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
        padding: 30px;
      }

      .box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 600px;
      }

      input,
      textarea {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
      }

      button {
        background: #4facfe;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      img {
        width: 60px;
      }

      a.hapus {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Manajemen Obat</h2>

    <div class="box">
      <h3>Tambah Obat</h3>
      <form
        method="POST"
        action="{{ url_for('tambah_obat') }}"
        enctype="multipart/form-data"
      >
        <input type="text" name="nama_obat" placeholder="Nama Obat" required />
        <textarea name="fungsi" placeholder="Fungsi / Gejala"></textarea>
        <input type="number" name="stok" placeholder="Stok" required />
        <input type="number" name="harga" placeholder="Harga" required />
        <input type="file" name="gambar" />
        <button type="submit">Simpan</button>
      </form>
    </div>

    <table>
      <tr>
        <th>Nama</th>
        <th>Fungsi</th>
        <th>Stok</th>
        <th>Harga</th>
        <th>Gambar</th>
        <th>Aksi</th>
      </tr>

      {% for o in obat %}
      <tr>
        <td>{{ o.nama_obat }}</td>
        <td>{{ o.fungsi }}</td>
        <td>{{ o.stok }}</td>
        <td>{{ o.harga }}</td>
        <td>
          {% if o.gambar %}
          <img src="{{ url_for('static', filename='images/' + o.gambar) }}" />
          {% endif %}
        </td>
        <td>
          <a class="hapus" href="{{ url_for('hapus_obat', id_obat=o.id_obat) }}"
            >Hapus</a
          >
        </td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
